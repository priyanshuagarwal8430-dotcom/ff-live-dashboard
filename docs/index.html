<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finsights Fundamental Dashboard</title>
<style>
/* ============================================================== tokens ===
   Light is the default. Dark is a token swap, nothing else: same type, same
   spacing, same layout. Every colour is defined on :root first, so a theme
   block can only ever redefine one, never introduce one. */
:root{
  --bg:#eef1f6; --card:#ffffff; --head:#12385f; --headink:#ffffff; --headink2:#9fc0dd;
  --ink:#0f1c2e; --ink2:#4a5768; --ink3:#8492a6; --line:#e0e5ec; --hover:#f6f8fb;
  --acc:#2f6fb0; --accfill:rgba(47,111,176,.10); --chip:#eef2f7;
  --good:#0a7a33; --bad:#c02b21; --track:#e6ebf2; --zero:#b9c2cf;
  --shadow:0 1px 3px rgba(15,28,46,.07),0 8px 22px -12px rgba(15,28,46,.16);
}
:root[data-theme=dark]{
  --bg:#0e131c; --card:#161d29; --head:#13243a; --headink:#e9eef5; --headink2:#8fa6bd;
  --ink:#e9eef5; --ink2:#a7b4c6; --ink3:#7c8a9d; --line:#232c3a; --hover:#1b2331;
  --acc:#5c9fdd; --accfill:rgba(92,159,221,.13); --chip:#1e2836;
  --good:#4cba6a; --bad:#ec6a5e; --track:#232c3a; --zero:#4a5768;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
/* A ten-column table of prices wants room. The page was 1160px, which left a
   third of the table hidden behind the scroll fade on a 1440px screen. */
.wrap{max-width:1360px;margin:0 auto;padding:0 0 64px}

/* ============================================================== header === */
.head{background:var(--head);color:var(--headink);padding:24px 26px 60px}
.head .inner{max-width:1308px;margin:0 auto;
  display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.head .who{flex:1 1 auto;min-width:0}
h1{font:700 21px/1.25 inherit;margin:0;letter-spacing:-.01em;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:#2f6fb0;color:#fff;border-radius:4px;padding:3px 7px;white-space:nowrap}
.asof{color:var(--headink2);font-size:12.5px;margin-top:6px}
/* The toggle is a flex sibling of the title, not an absolutely positioned
   overlay. Positioned absolutely it sat on top of the LIVE tag on a phone. */
.tbtn{flex:0 0 auto;display:flex;gap:7px;align-items:center;cursor:pointer;
  font:600 11px/1 inherit;letter-spacing:.09em;text-transform:uppercase;
  background:transparent;color:#cfe0ef;border:1px solid rgba(255,255,255,.28);
  border-radius:20px;padding:9px 14px}
.tbtn:hover{border-color:#fff;color:#fff}
.tbtn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.7}

/* =============================================================== cards === */
.body{max-width:1308px;margin:-44px auto 0;padding:0 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
.strip{display:flex;align-items:center;gap:30px;flex-wrap:wrap}
.strip .k,.kpi .k{color:var(--ink3);font-size:11px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase}
.strip .v{font-size:25px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
.strip .spk{margin-left:auto}
.spk .ln{stroke:var(--acc);fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.spk .ar{fill:var(--accfill)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:16px 18px;box-shadow:var(--shadow)}
.kpi .v{font-size:25px;font-weight:700;margin-top:5px;letter-spacing:-.02em}
h2{font:700 15px/1.25 inherit;margin:0 0 3px}
.sub{color:var(--ink3);font-size:12.5px;margin:0 0 16px}
.cardhead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.cardhead .t{flex:1 1 260px;min-width:0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=search]{font:13px inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:8px 11px;width:150px}
input[type=search]:focus{outline:2px solid var(--acc);outline-offset:-1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font:600 11.5px/1 inherit;background:transparent;color:var(--ink2);
  border:0;padding:9px 15px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}

/* ============================================================== tables === */
/* When the table is wider than its card it scrolls, and a fade on the right
   edge is what tells the reader that. Without it the last column just looks
   cut off. */
.scroll{overflow-x:auto;position:relative}
.scroll.over{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 34px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 34px),transparent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:right;color:var(--ink3);font-weight:600;font-size:10.5px;
  letter-spacing:.07em;text-transform:uppercase;padding:0 8px 10px;white-space:nowrap;
  cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th[aria-sort]:after{content:"";display:inline-block;width:0;height:0;margin-left:5px;
  border-left:3.5px solid transparent;border-right:3.5px solid transparent}
th[aria-sort=ascending]:after{border-bottom:4px solid var(--acc)}
th[aria-sort=descending]:after{border-top:4px solid var(--acc)}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
td{text-align:right;padding:10px 8px;border-top:1px solid var(--line);white-space:nowrap}
.sub2{display:block;font-size:11px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--hover)}
.sym{font-weight:700}
.tick{color:inherit;text-decoration:none;border-bottom:1px dotted var(--ink3)}
.tick:hover{color:var(--acc);border-bottom-color:var(--acc)}
.chip{display:inline-block;font-size:10.5px;font-weight:600;color:var(--ink2);
  background:var(--chip);border-radius:5px;padding:2px 7px;margin-left:7px}
.mut{color:var(--ink3)}
.good{color:var(--good)}.bad{color:var(--bad)}
.why{font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--chip);
  border-radius:5px;padding:3px 8px;white-space:nowrap}
/* News tints. The label is still the carrier - the colour only groups, so a
   reader who cannot separate these hues loses nothing. Every tint is defined
   for both themes; none is left to inherit. */
[data-cat]{--t:var(--ink2); --tb:var(--chip)}
[data-cat="Results"]         {--t:#1c5b96; --tb:#e3eefa}
[data-cat="Corporate action"]{--t:#8a5a10; --tb:#fdf0dd}
[data-cat="Board meeting"]   {--t:#5b3b8c; --tb:#efe8fa}
[data-cat="Deal"]            {--t:#0a6b63; --tb:#dcf2f0}
[data-cat="Order win"]       {--t:#0a7a33; --tb:#e0f3e6}
[data-cat="Policy"]          {--t:#12385f; --tb:#e6edf5}
[data-cat="Press"]           {--t:#6b5330; --tb:#f3eee4}
:root[data-theme=dark] [data-cat]{--t:var(--ink2); --tb:#1e2836}
:root[data-theme=dark] [data-cat="Results"]         {--t:#7fb6ea; --tb:#152b42}
:root[data-theme=dark] [data-cat="Corporate action"]{--t:#e0b45f; --tb:#33280f}
:root[data-theme=dark] [data-cat="Board meeting"]   {--t:#b79ce6; --tb:#241a38}
:root[data-theme=dark] [data-cat="Deal"]            {--t:#5cc8bd; --tb:#0f2b29}
:root[data-theme=dark] [data-cat="Order win"]       {--t:#69c583; --tb:#12291a}
:root[data-theme=dark] [data-cat="Policy"]          {--t:#9fc0dd; --tb:#16283c}
:root[data-theme=dark] [data-cat="Press"]           {--t:#d3bd94; --tb:#2b2416}
.news .why{color:var(--t);background:var(--tb)}
/* the meter, with a below-entry zone on the left */
.meter{position:relative;display:inline-block;vertical-align:middle;
  width:92px;height:8px;background:var(--track);border-radius:5px;overflow:hidden}
.meter i{position:absolute;top:0;height:100%;display:block}
.meter .zero{left:14%;width:1px;background:var(--zero);z-index:2}
.meter .pos{left:14%;background:var(--acc);border-radius:0 5px 5px 0}
.meter .neg{background:var(--bad);border-radius:5px 0 0 5px}
.pnum{display:inline-block;min-width:42px;margin-left:10px;font-size:12.5px}
.empty{color:var(--ink3);font-size:13px;padding:22px 0;text-align:center}
/* Collapsible sections. On a phone the holding-period table is nineteen stacked
   cards of nine rows each, and the news sat below all of it. It now starts
   closed, and the choice is remembered per viewer. */
.acc{display:flex;align-items:center;gap:10px;width:100%;background:transparent;
  border:0;padding:0;cursor:pointer;color:inherit;text-align:left;font:inherit}
.acc h2{flex:1 1 auto;margin:0}
.acc .chev{flex:0 0 auto;width:9px;height:9px;border-right:2px solid var(--ink3);
  border-bottom:2px solid var(--ink3);transform:rotate(45deg);margin:0 4px 4px 0;
  transition:transform .15s}
.acc[aria-expanded=false] .chev{transform:rotate(-45deg);margin:0 4px 0 0}
.acc:hover .chev{border-color:var(--acc)}
.acc .count{flex:0 0 auto;font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3);background:var(--chip);
  border-radius:5px;padding:3px 8px}
.panel[hidden]{display:none}

/* ---- market strip. Ten instruments times six columns is a table, not cards:
   stacked on a phone it would be sixty rows before the first position. So the
   longer windows hide below 760px and name / price / 1D stay. */
.mkt td,.mkt th{padding:9px 8px}
.mkt .nm{font-weight:600}
.mkt .sub2{font-weight:400}
.mnote{color:var(--ink3);font-size:12px;line-height:1.55;margin:12px 0 0;
  max-width:82ch}
@media (max-width:760px){
  .mkt .w{display:none}
  .mkt table,.mkt tbody,.mkt tr,.mkt td{display:table-row-group}
  .mkt table{display:table}.mkt tbody{display:table-row-group}
  .mkt tr{display:table-row;border:0;border-radius:0;padding:0;margin:0}
  /* No horizontal padding put the price hard against the 1D figure -
     "24,812.40+0.42%" read as one number. The gap goes on the left of every
     cell but the first, which stays flush with the card edge. */
  .mkt td,.mkt th{display:table-cell;text-align:right;border:0;
    border-top:1px solid var(--line);padding:10px 0 10px 16px;white-space:nowrap}
  .mkt th{border-top:0}
  .mkt td::before{content:none}
  .mkt td.first,.mkt th:first-child{font-weight:600;text-align:left;padding-left:0}
  /* The card layout's td.first carries a bottom rule; here it left a stub of a
     line hanging under the last instrument, the width of one column. */
  .mkt td.first{font-size:14px;border-bottom:0}
  .mkt thead{display:table-header-group}
}

/* ---- information button and its dialog ---- */
.ibtn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink3);
  background:transparent;color:var(--ink3);cursor:pointer;font:700 12px/1 serif}
.ibtn:hover{border-color:var(--acc);color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(8,14,24,.55);display:flex;
  align-items:center;justify-content:center;padding:18px;z-index:60}
.modal[hidden]{display:none}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;
  max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.modal h3{font:700 16px/1.25 inherit;margin:0 0 3px}
.modal .x{float:right;background:transparent;border:0;color:var(--ink3);
  font:400 22px/1 inherit;cursor:pointer;padding:0 2px}
.modal .x:hover{color:var(--ink)}
.mtable td:first-child{text-align:left;color:var(--ink2)}
.mtable td{padding:9px 8px;font-variant-numeric:tabular-nums}
.note{font-size:11.5px;color:var(--ink3);line-height:1.7;margin-top:16px;
  padding-top:12px;border-top:1px solid var(--line)}
/* Nineteen positions is nineteen stacked cards on a phone, and the news sat at
   the far end of them. Collapsing the holding-period table helped; this makes
   the distance irrelevant. */
.jump{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.jump a{font:600 11.5px/1 inherit;letter-spacing:.03em;text-decoration:none;
  color:var(--ink2);background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:9px 13px}
.jump a:hover{color:var(--acc);border-color:var(--acc)}
html{scroll-behavior:smooth}
:target{scroll-margin-top:14px}
footer{color:var(--ink3);font-size:11.5px;line-height:1.75;padding:8px 4px 0}
.err{background:#fdecea;color:#8a1c14;border:1px solid #f3b8b2;border-radius:10px;
  padding:14px 16px;margin-bottom:16px;font-size:13px}
:root[data-theme=dark] .err{background:#2b1614;color:#f0a49c;border-color:#54241f}

/* ============================================================== mobile ===
   The positions table is 9 columns and about 970px wide against a 390px
   screen. Left as a table it forces a sideways drag to reach the return
   column, so below 700px every row becomes a stacked card and each cell
   carries its own label. No duplicate markup: the labels come from
   data-label via ::before. */
@media (max-width:700px){
  .head{padding:20px 16px 56px}
  .body{padding:0 16px}
  .card{padding:16px}
  h1{font-size:19px}
  /* Stacked one-per-row the index card cost most of a phone screen before the
     first position was visible. Two columns halves it. */
  .strip{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
  .strip .v{font-size:21px}
  .strip>div:nth-child(3){grid-column:1/-1}
  .strip .spk{margin-left:0;width:100%;grid-column:1/-1}
  .strip .spk svg{width:100%;height:56px}
  input[type=search]{width:100%}
  .tools{width:100%}
  .seg{width:100%}
  .seg button{flex:1}
  .scroll{overflow-x:visible}
  table,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{border:1px solid var(--line);border-radius:11px;padding:4px 13px 8px;margin-bottom:11px}
  tbody tr:hover{background:transparent}
  td{display:flex;justify-content:space-between;align-items:center;gap:14px;
     text-align:right;padding:8px 0;border:0;border-bottom:1px dashed var(--line);
     white-space:normal}
  td:last-child{border-bottom:0}
  td::before{content:attr(data-label);color:var(--ink3);font-size:10.5px;font-weight:600;
     letter-spacing:.06em;text-transform:uppercase;text-align:left;flex:0 0 auto}
  td.first{font-size:16px;font-weight:700;padding:10px 0 9px;
     border-bottom:1px solid var(--line);justify-content:flex-start}
  td.first::before{content:none}
  .meter{width:96px}
}
</style></head><body>

<div class="wrap">
  <div class="head"><div class="inner">
    <div class="who">
      <h1>Finsights Fundamental Dashboard <span class="tag">Live</span></h1>
      <div class="asof" id="asof">loading…</div>
    </div>
    <button class="tbtn" id="theme" aria-label="Switch to dark theme">
      <span id="ticon"></span><span id="tlabel">Dark</span></button>
  </div></div>

  <div class="body" id="body">
    <div class="card"><div class="empty">Loading…</div></div>
  </div>
</div>

<script>
"use strict";
const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
const SUN  = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>';

/* ---------------------------------------------------------------- theme ---
   Stored per viewer, in their browser only. Wrapped because a browser set to
   block site data throws on access rather than returning null. */
function readTheme(){ try{ return localStorage.getItem("ff-theme"); }catch(e){ return null; } }
function saveTheme(v){ try{ localStorage.setItem("ff-theme", v); }catch(e){} }
let dark = readTheme() === "dark";
function paintTheme(){
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  document.getElementById("ticon").innerHTML = dark ? SUN : MOON;
  document.getElementById("tlabel").textContent = dark ? "Light" : "Dark";
  document.getElementById("theme").setAttribute("aria-label",
    dark ? "Switch to light theme" : "Switch to dark theme");
}
paintTheme();
document.getElementById("theme").addEventListener("click", () => {
  dark = !dark; saveTheme(dark ? "dark" : "light"); paintTheme();
});

/* -------------------------------------------------------------- helpers --- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = v => v == null ? "—" : Number(v).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
/* Signed, always. Green and red are 4.1 apart under deuteranopia, so the sign
   is what actually carries the meaning. Do not remove it to tidy the column. */
const sgn = (v,dp=2) => v == null ? "—" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(dp);
const cls = v => v == null ? "mut" : (v >= 0 ? "good" : "bad");
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dmy = s => { if(!s) return "—"; const [y,m,d] = s.split("-"); return `${d} ${MON[+m-1]} ${y}`; };

/* The symbol opens that stock's chart at TradingView in a new tab. A link, not
   an embedded widget: embedding carries their terms, a link carries none. */
/* Backtested outcomes, 2012 to July 2026, computed from the 279 trades that have
   actually closed. NOT the live record. The methodology document's headline win
   rate of 76.0% is taken over all 358 signals including the 79 still open at
   mark-to-market; on the 279 that closed it is 78.9%. Every figure here is on the
   closed basis, because "did it reach its target" cannot be asked of a position
   still running - and the panel says so. */
/* ts_loss is the median of the LOSING cap exits only, not of all of them. It sits
   next to ts_win because the two answer one question together: how often the cap
   exit loses, and how much it loses when it does. Reading ts_median alone hides
   that - a bucket that is 52% winners and median +4.8% overall still carries a
   median loss of 31% on the half that lost. */
const BACKTEST = {
 All:  {resolved:279, open:79, ath_months:16.8, ath_pct:55.9, ath_median:75.0,
        ts_pct:44.1, ts_win:52.0, ts_median:4.8,  ts_loss:-31.3, win:78.9, median:68.7},
 Large:{resolved:54,  open:8,  ath_months:16.8, ath_pct:63.0, ath_median:76.0,
        ts_pct:37.0, ts_win:45.0, ts_median:-4.7, ts_loss:-35.5, win:79.6, median:69.2},
 Mid:  {resolved:80,  open:23, ath_months:16.3, ath_pct:52.5, ath_median:71.9,
        ts_pct:47.5, ts_win:55.3, ts_median:6.0,  ts_loss:-30.8, win:78.8, median:67.2},
 Small:{resolved:145, open:48, ath_months:17.0, ath_pct:55.2, ath_median:76.7,
        ts_pct:44.8, ts_win:52.3, ts_median:8.7,  ts_loss:-32.0, win:78.6, median:69.9}};
/* A share of trades and a return are not the same kind of number. A win rate of
   78.9% is not "+78.9%": the sign and the colour belong only to returns, where
   they carry meaning. Rows are tagged so the two never render alike.
   n = count, mo = months, sh = share of trades, ret = signed return. */
const MROWS = [
 ["Trades closed","resolved","n"],["Average months to reach the high","ath_months","mo"],
 ["Reached the high","ath_pct","sh"],["Median return, reached the high","ath_median","ret"],
 ["Hit the 1,095-day cap","ts_pct","sh"],["Win rate at the cap","ts_win","sh"],
 ["Median return at the cap","ts_median","ret"],
 ["Median loss when the cap exit loses","ts_loss","ret"],
 ["Overall win rate","win","sh"],
 ["Overall median return","median","ret"]];
let seg = "All";

const chartUrl = sym => `https://www.tradingview.com/chart/?symbol=NSE%3A${encodeURIComponent(String(sym||"").trim())}`;

function spark(pts,w,h){
  if(!pts || pts.length < 2) return "";
  const lo = Math.min(...pts), hi = Math.max(...pts), r = (hi-lo)||1;
  const X = i => (i/(pts.length-1))*w, Y = v => h-((v-lo)/r)*(h-4)-2;
  const d = pts.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  return `<svg class="spkfig" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
    aria-label="Nifty 500, last twelve months"><path class="ar" d="${d} L ${w} ${h} L 0 ${h} Z"/>
    <path class="ln" d="${d}"/></svg>`;
}
/* Days elapsed against the 1,095-day cap: how much of the position's allowed
   life has run, and so how much is left. */
function dmeter(d, cap){
  if(d == null) return '<span class="mut">—</span>';
  const w = Math.max(0, Math.min(100, 100 * d / (cap || 1095)));
  return `<span class="meter"><i class="pos" style="left:0;width:${w.toFixed(1)}%"></i></span>
    <span class="pnum mut">${d.toLocaleString("en-IN")}</span>`;
}
function meter(p){
  if(p == null) return '<span class="mut">—</span>';
  const pos = Math.max(0, Math.min(100, p)) * 0.86;
  const neg = Math.min(Math.abs(Math.min(0, p)), 20) / 20 * 14;
  return `<span class="meter">${neg?`<i class="neg" style="right:86%;width:${neg.toFixed(1)}%"></i>`:""}
    <i class="zero"></i>${pos?`<i class="pos" style="width:${pos.toFixed(1)}%"></i>`:""}</span>
    <span class="pnum ${cls(p)}">${sgn(p,0)}%</span>`;
}

/* ------------------------------------------------------------- rendering --- */
let DATA = {}, sortKey = "ret_pct", sortDir = -1, query = "", cap = "";
/* Sections start closed unless the viewer opened them before. */
const OPEN_DEFAULT = {mkt:true, perf:false, closed:false};
function open2(k){
  try{ const v = localStorage.getItem("ff-open-"+k); if(v !== null) return v; }catch(e){}
  return String(OPEN_DEFAULT[k]);
}

const COLS = [
  {k:"symbol",    t:"Symbol",             kind:"sym", first:true},
  {k:"entry_date",t:"Entry date",         kind:"date"},
  {k:"entry_price",t:"Entry price",       kind:"num"},
  /* "Last close", not "Previous close": the page updates after the close, so on
     that evening the figure IS the day's close. "Last close" is true at both
     moments. */
  {k:"last",      t:"Last close",         kind:"num"},
  {k:"ret_pct",   t:"Return",             kind:"pct"},
  /* Discount at entry is not a column. Entry price and the trigger ATH are both
     on the row, so the reader can see how far below the high it was bought
     without a third number telling them - and a column whose label had to carry
     "at entry" to be unambiguous was carrying too much. It stays in
     positions.json. */
  {k:"target",    t:"Trigger ATH / target", kind:"mut"},
  {k:"ath_date",  t:"ATH date",           kind:"raw"},
  {k:"progress_pct",t:"Progress", kind:"meter"},
  {k:"days_since_entry",t:"Days held",    kind:"days_meter"},
];
/* trigger_reason is deliberately NOT a column. It stays in positions.json as the
   cross-check for a deep entry; an advisory publishes the signal, not the
   mechanics behind it. */

/* A closed trade answers different questions: what it returned, how long it
   took, and how it ended. Progress to target is meaningless once the target is
   reached, and "last price" is just the exit price. */
const CLOSED_COLS = [
  {k:"symbol",     t:"Symbol",      kind:"sym", first:true},
  {k:"entry_date", t:"Entry date",  kind:"date"},
  {k:"entry_price",t:"Entry price",  kind:"num"},
  {k:"exit_date",  t:"Exit date",    kind:"date"},
  {k:"exit_price", t:"Exit price",   kind:"num"},
  {k:"ret_pct",    t:"Return",       kind:"pct"},
  {k:"days_held",  t:"Days held",    kind:"days"},
  {k:"exit_reason",t:"How it ended", kind:"reason"},
];
const REASON = {ATH_TARGET:"Target reached", TIME_STOP:"Time cap"};

function cell(r,c){
  const v = r[c.k];
  switch(c.kind){
    case "sym":   return `<a class="sym tick" href="${chartUrl(v)}" target="_blank"
      rel="noopener">${esc(v)}</a><span class="chip">${esc(r.market_type)}</span>`;
    case "date":  return `<span class="mut">${dmy(v)}</span>`;
    case "num":   return money(v);
    case "pct":   return `<span class="${cls(v)}">${sgn(v)}%</span>`;
    case "dd":    return v == null ? "—" : `${v.toFixed(2)}%`;
    case "why":   return `<span class="why">${esc(v || "—")}</span>`;
    case "mut":   return `<span class="mut">${money(v)}</span>`;
    case "raw":   return `<span class="mut">${esc(v || "—")}</span>`;
    case "target":return `<span class="mut">${money(v)}</span><span class="sub2">${esc(r.ath_date || "—")}</span>`;
    case "days":  return v == null ? "—" : `${v.toLocaleString("en-IN")}`;
    case "reason":return `<span class="why">${esc(REASON[v] || v || "—")}</span>`;
    case "meter": return meter(v);
    case "days_meter": return dmeter(v, r.cap_days);
  }
}
function tableFor(rows, cols){
  cols = cols || COLS;
  if(!rows.length) return `<div class="empty">Nothing here yet.</div>`;
  const head = cols.map(c =>
    `<th data-k="${c.k}"${c.k===sortKey?` aria-sort="${sortDir<0?"descending":"ascending"}"`:""}>${c.t}</th>`).join("");
  const body = rows.map(r => "<tr>" + cols.map(c =>
    `<td class="${c.first?"first":""}" data-label="${c.t}">${cell(r,c)}</td>`).join("") + "</tr>").join("");
  return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function periodTable(rows,periods){
  if(!rows.length) return `<div class="empty">Nothing here yet.</div>`;
  const head = `<th>Symbol</th><th>Entry date</th>` + periods.map(p=>`<th>${p}</th>`).join("");
  const body = rows.map(r => `<tr>
      <td class="first" data-label="Symbol"><a class="sym tick" href="${chartUrl(r.symbol)}"
        target="_blank" rel="noopener">${esc(r.symbol)}</a></td>
      <td data-label="Entry date"><span class="mut">${dmy(r.entry_date)}</span></td>` +
      periods.map(p => { const v = r.periods ? r.periods[p] : null;
        return `<td data-label="${p}">${v==null?'<span class="mut">—</span>':`<span class="${cls(v)}">${sgn(v)}%</span>`}</td>`;
      }).join("") + "</tr>").join("");
  return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function newsList(items){
  if(!items || !items.length) return "";
  return items.map(n => {
    const head = n.url
      ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.headline||"")}</a>`
      : esc(n.headline || "");
    /* An NSE filing is the company's own document, so the symbol leads and the
       filing type is the chip. A press item is somebody's writing, so the
       outlet's name is the chip and nothing pretends to be a fact about a
       stock. The reader can always tell which they are looking at. */
    const feed = n.source === n.symbol;
    /* An NSE item names a stock, so its symbol links to that stock's chart. A
       press item names an outlet, which is not a ticker and must not pretend to
       be one. */
    const who = feed ? esc(n.symbol||"")
      : `<a class="tick" href="${chartUrl(n.symbol)}" target="_blank" rel="noopener"
           >${esc(n.symbol||"")}</a> · `;
    return `<div class="news" data-cat="${esc(n.category||"")}">
      <span class="why">${esc(feed ? n.symbol : (n.category||""))}</span>
      <span>${feed ? "" : who}${head}</span>
      <span class="mut">${esc(dmy(n.date))}</span></div>`;
  }).join("");
}
/* The portfolio pane is layered: what touches a position first, then the rest of
   the index. The macro pane is deliberately empty and says so - NSE has nothing
   on policy or global cues, and the outlets that do own that copy. */
function marketTable(){
  const M = DATA.market || {};
  const rows = M.rows || [];
  if(!rows.length) return `<div class="empty">The market feed did not load.</div>`;
  const w = c => `<th class="w">${c}</th>`;
  return `<div class="scroll mkt"><table><thead><tr><th>Instrument</th><th>Last</th>
    <th>1D</th>${w("1W")}${w("1M")}${w("6M")}${w("1Y")}</tr></thead><tbody>` +
    rows.map(x => `<tr>
      <td class="first nm" data-label="Instrument">${esc(x.n)}</td>
      <td data-label="Last">${esc(x.p)}</td>
      <td data-label="1D" class="${cls(x.d)}">${x.d==null?"—":sgn(x.d)+"%"}</td>
      ${["w","m","s","y"].map(k =>
        `<td class="w ${cls(x[k])}">${x[k]==null?"—":sgn(x[k])+"%"}</td>`).join("")}
      </tr>`).join("") +
    `</tbody></table>
    <p class="mnote">Gold and crude are the international contracts converted at
     USD/INR — they carry no import duty, so they read below an MCX screen.
     Every window is calendar days: 7, 30, 182, 365. The Nifty rows come from
     NSE, which does not publish a six-month change; that column is built from
     this dashboard\u2019s own daily record and stays blank until it reaches back
     six months.</p></div>`;
}
function metricsTable(){
  const cols = ["All","Large","Mid","Small"];
  const head = `<tr><th>Backtested outcome</th>` +
    cols.map(c => `<th${c===seg?' aria-sort="descending"':''}>${c}</th>`).join("") + `</tr>`;
  const body = MROWS.map(([lbl,k,kind]) => `<tr><td>${lbl}</td>` +
    cols.map(c => {
      const v = BACKTEST[c][k];
      const col = kind === "ret" ? cls(v) : "";
      const txt = v == null ? "—"
                : kind === "ret" ? sgn(v,1) + "%"
                : kind === "sh"  ? v.toFixed(1) + "%"
                : kind === "mo"  ? v.toFixed(1)
                : v.toLocaleString("en-IN");
      return `<td class="${c===seg?"":"mut"} ${col}">${txt}</td>`;
    }).join("") + `</tr>`).join("");
  return `<div class="scroll"><table class="mtable"><thead>${head}</thead>
    <tbody>${body}</tbody></table></div>`;
}
function newsPane(which){
  const N = DATA.news || {};
  if(which === "macro"){
    const a = newsList(N.policy), b = newsList(N.press);
    if(!a && !b) return `<div class="empty">Nothing in the last few days.</div>`;
    return (a ? `<p class="sub" style="margin:2px 0 0">Policy and regulation · RBI and SEBI</p>${a}` : "")
         + (b ? `<p class="sub" style="margin:26px 0 0">In the market · headlines from the
                 Indian financial press. Follow one to read it at the source.</p>${b}` : "");
  }
  const a = newsList(N.portfolio), b = newsList(N.market);
  if(!a && !b) return `<div class="empty">No announcements in the last seven days.</div>`;
  return (a ? `<p class="sub" style="margin:2px 0 0">Your holdings</p>${a}` : "")
       + (b ? `<p class="sub" style="margin:26px 0 0">Across the Nifty 500</p>${b}` : "");
}

function render(){
  const m = DATA.meta, ix = DATA.index;
  const q = query.trim().toUpperCase();
  const all = DATA.positions || [];
  const open = all.filter(r => (!q || r.symbol.includes(q)) && (!cap || r.market_type === cap));
  const tiers = ["Large Cap","Mid Cap","Small Cap"];
  const capBtn = (v,label) => {
    const n = v ? all.filter(r => r.market_type === v).length : all.length;
    return `<button data-cap="${v}" aria-pressed="${String(cap===v)}">${label} ${n}</button>`;
  };
  const sorted = open.slice().sort((a,b) => {
    const x = a[sortKey], y = b[sortKey];
    if(x == null) return 1; if(y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * sortDir;
  });
  const chg = ix ? ix.last - ix.prev : null, pct = ix ? 100*chg/ix.prev : null;

  document.getElementById("asof").textContent =
    `Tracking since ${dmy(m.tracking_since)} · prices as of ${dmy(m.as_of)}`;

  document.getElementById("body").innerHTML = `
   ${ix ? `<div class="card strip">
     <div><div class="k">${esc(ix.name)}</div><div class="v">${money(ix.last)}</div></div>
     <div><div class="k">Day</div><div class="v ${cls(chg)}">${sgn(chg)}
       <span style="font-size:14px">(${sgn(pct)}%)</span></div></div>
     <div><div class="k">52-week range</div><div class="v" style="font-size:15px">
       ${ix.lo.toLocaleString("en-IN")} — ${ix.hi.toLocaleString("en-IN")}</div></div>
     <div class="spk">${spark(ix.points,300,50)}</div>
   </div>` : ""}

   <div class="kpis">
     <div class="kpi"><div class="k">Open positions</div><div class="v">${m.open}</div></div>
     <div class="kpi"><div class="k">Closed</div><div class="v">${m.closed}</div></div>
     <div class="kpi"><div class="k">In profit</div><div class="v">${m.in_profit} / ${m.open}</div></div>
     <div class="kpi"><div class="k">Average return</div>
       <div class="v ${cls(m.avg_return)}">${sgn(m.avg_return)}%</div></div>
   </div>

   <div class="card" id="s-mkt">
     <button class="acc" data-sec="mkt" aria-expanded="${open2("mkt")}">
       <h2>Markets</h2><span class="count">${(DATA.market&&DATA.market.rows||[]).length}</span><span class="chev"></span></button>
     <div class="panel" ${open2("mkt")==="true"?"":"hidden"}>
       <p class="sub" style="margin-top:10px">Reference only. Nothing here is
       compared against the strategy.</p>
       ${marketTable()}
     </div>
   </div>

   <nav class="jump" aria-label="Jump to a section">
     <a href="#s-mkt">Markets</a><a href="#s-pos">Positions</a><a href="#s-perf">Performance</a>
     <a href="#s-closed">Closed</a><a href="#s-news">News</a>
   </nav>

   <div class="card" id="s-pos">
     <div class="cardhead">
       <div class="t"><h2 style="display:flex;align-items:center;gap:9px">Open positions
         <button class="ibtn" id="info" aria-label="Backtested outcomes">i</button></h2>
         <p class="sub">The target is fixed on the signal date and never moved.
         Tap a symbol to open its chart.</p></div>
       <div class="tools">
         <div class="seg" id="cap">${capBtn("","All")}${tiers.map(t =>
            capBtn(t, t.replace(" Cap",""))).join("")}</div>
         <input type="search" id="q" placeholder="Find a symbol" value="${esc(query)}"
                aria-label="Find a symbol">
       </div>
     </div>
     ${tableFor(sorted)}
   </div>

   <div class="card" id="s-perf">
     <button class="acc" data-sec="perf" aria-expanded="${open2("perf")}">
       <h2>Performance by holding period</h2>
       <span class="count">${sorted.length}</span><span class="chev"></span></button>
     <div class="panel" ${open2("perf")==="true"?"":"hidden"}>
       <p class="sub" style="margin-top:10px">A column fills once that period has
       elapsed since entry. A dash means not yet due.</p>
       ${periodTable(sorted, m.periods || [])}
     </div>
   </div>

   <div class="card" id="s-closed">
     <button class="acc" data-sec="closed" aria-expanded="${open2("closed")}">
       <h2>Closed trades</h2>
       <span class="count">${m.closed}</span><span class="chev"></span></button>
     <div class="panel" ${open2("closed")==="true"?"":"hidden"}>
       <p class="sub" style="margin-top:10px">A position closes at its target or at
       the 1,095-day cap. <strong>Days held</strong> is the time it took.</p>
       ${(DATA.closed||[]).length ? tableFor(DATA.closed, CLOSED_COLS)
          : `<div class="empty">No position has closed yet. Return at target and the
             days it took appear here on the first exit.</div>`}
     </div>
   </div>

   <div class="card" id="s-news">
     <h2>News</h2>
     <p class="sub">Filings from NSE, and what the market is reading.</p>
     <div class="seg" id="nseg">
       <button data-pane="portfolio" aria-pressed="true">Portfolio &amp; index</button>
       <button data-pane="macro" aria-pressed="false">India &amp; world</button>
     </div>
     <div id="npane">${newsPane("portfolio")}</div>
   </div>

   <div class="modal" id="modal" hidden>
     <div class="box" role="dialog" aria-modal="true" aria-labelledby="mt">
       <button class="x" id="mx" aria-label="Close">&times;</button>
       <h3 id="mt">Backtested outcomes</h3>
       <p class="sub">2012 to July 2026, on the 279 signals that have closed.
       This is not the live record above.</p>
       <div class="seg" id="segsw" style="margin-bottom:14px">
         ${["All","Large","Mid","Small"].map(c =>
           `<button data-seg="${c}" aria-pressed="${String(c===seg)}">${c}</button>`).join("")}
       </div>
       <div id="mbody">${metricsTable()}</div>
       <p class="note">Backtested, not live. A further 79 signals were still open at
       the end of the test and are excluded here, because whether a position reached
       its target cannot be asked of one still running. The last cap row is the
       median of the losing cap exits only, so it reads alongside the win rate
       above it rather than in place of the median beside it. The methodology document's
       headline win rate of 76.0% is taken over all 358 signals including those 79 at
       mark-to-market; on the 279 that closed it is 78.9%. Quarterly results are
       assumed available 60 days after quarter end — measured against real
       announcement dates that assumption runs a median 17 days late, and never
       early. Past performance does not indicate future results.</p>
     </div>
   </div>

   <footer>For subscribed clients. Signals follow a fixed rule set and are not
   personalised advice. Investments in securities carry market risk; past performance
   does not indicate future results. Registration details and full disclaimer to be
   inserted here.</footer>`;

  document.querySelectorAll(".scroll").forEach(el =>
    el.classList.toggle("over", el.scrollWidth > el.clientWidth + 2));
  document.querySelectorAll("th[data-k]").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k;
    if(k === sortKey) sortDir = -sortDir; else { sortKey = k; sortDir = -1; }
    render();
  }));
  const modal = document.getElementById("modal");
  document.getElementById("info").addEventListener("click", () => modal.hidden = false);
  document.getElementById("mx").addEventListener("click", () => modal.hidden = true);
  modal.addEventListener("click", e => { if(e.target === modal) modal.hidden = true; });
  document.addEventListener("keydown", e => { if(e.key === "Escape") modal.hidden = true; });
  document.querySelectorAll("#segsw button").forEach(b => b.addEventListener("click", () => {
    seg = b.dataset.seg;
    document.querySelectorAll("#segsw button").forEach(x =>
      x.setAttribute("aria-pressed", String(x.dataset.seg === seg)));
    document.getElementById("mbody").innerHTML = metricsTable();
  }));
  document.querySelectorAll(".acc").forEach(b => b.addEventListener("click", () => {
    const on = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", String(on));
    b.parentElement.querySelector(".panel").hidden = !on;
    try{ localStorage.setItem("ff-open-"+b.dataset.sec, String(on)); }catch(e){}
  }));
  document.querySelectorAll("#cap button").forEach(b => b.addEventListener("click", () => {
    cap = b.dataset.cap; render();
  }));
  const qi = document.getElementById("q");
  if(qi) qi.addEventListener("input", e => {
    query = e.target.value;
    render();
    const n = document.getElementById("q");
    if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  });
  document.querySelectorAll("#nseg button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("#nseg button").forEach(x =>
      x.setAttribute("aria-pressed", String(x === b)));
    document.getElementById("npane").innerHTML = newsPane(b.dataset.pane);
  }));
}

/* ------------------------------------------------------------------ load --- */
const FILES = ["meta","positions","closed","index","news"];
/* market.json is fetched but NOT required. The strip is reference material;
   the positions are the product. A market feed that fails must not take the
   whole page down with it, so it resolves to null and the section hides. */
Promise.all(FILES.map(f =>
  fetch(`data/${f}.json`, {cache:"no-store"})
    .then(r => r.ok ? r.json() : Promise.reject(new Error(`${f}.json: HTTP ${r.status}`)))
).concat([
  fetch("data/market.json", {cache:"no-store"})
    .then(r => r.ok ? r.json() : null).catch(() => null)
])).then(vals => {
  FILES.forEach((f,i) => DATA[f] = vals[i]);
  DATA.market = vals[FILES.length] || null;
  render();
}).catch(err => {
  document.getElementById("asof").textContent = "could not load";
  document.getElementById("body").innerHTML =
    `<div class="err"><strong>The data files did not load.</strong><br>${esc(err.message)}
     <br><br>This page reads <code>data/*.json</code> from the same folder. Opened
     straight off disk the browser blocks that; served over http it works.</div>`;
});
</script>
<style>
.news{padding:11px 0 11px 12px;border-top:1px solid var(--line);display:flex;gap:13px;
  align-items:baseline;border-left:3px solid transparent;transition:border-color .12s}
.news[data-cat]{border-left-color:var(--tb)}
.news:hover{background:var(--hover);border-left-color:var(--t)}
/* border-bottom draws under EVERY wrapped line, so a three-line headline on a
   phone came out triple-underlined and looked like a mistake. The underline
   arrives on hover instead, where it belongs. */
.news a{color:var(--ink);text-decoration:none}
.news a:hover{color:var(--acc);text-decoration:underline;text-underline-offset:3px;
  text-decoration-thickness:1px}
.news .tick{border-bottom:1px dotted var(--ink3)}
.news .tick:hover{text-decoration:none;border-bottom-color:var(--acc)}
.news .why{flex:0 0 auto;min-width:108px;text-align:center}
.news:first-of-type{border-top:0}
.news .mut{margin-left:auto;white-space:nowrap}
@media (max-width:700px){ .news{flex-wrap:wrap;gap:8px} .news .mut{margin-left:0} }
</style>
</body></html>
