name: Market strip probe

# Manual only. This deliberately does NOT touch daily_update.yml - that
# workflow has broken three times on changes made to it in passing, and a
# throwaway probe is not worth a fourth. Run it from the Actions tab,
# read the log, then delete both this file and FF_market_probe.py.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet yfinance pandas

      - name: Probe the market symbols
        run: python FF_market_probe.py
