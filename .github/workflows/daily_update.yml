# FF — Daily Live Dashboard Update
# ====================================
# Runs every trading-day evening after NSE close: refresh OHLC -> scan for
# signals -> rebuild the dashboard -> publish to GitHub Pages.
#
# Can also be triggered by hand from the Actions tab -> this workflow ->
# "Run workflow".

name: Daily Dashboard Update

on:
  schedule:
    # 13:30 UTC = 19:00 IST, Monday-Friday. Well after the 15:30 close, so
    # Yahoo has published end-of-day data.
    - cron: '30 13 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas numpy beautifulsoup4 lxml

      # A fast, network-free proof that the corporate-action logic still
      # behaves before it is allowed anywhere near the real files. If the
      # guard that refuses a non-equity bonus ever breaks, the run stops here
      # instead of writing a 21x cliff into the price history.
      - name: Updater self-test
        run: python FF_OHLC_Updater_v2.py --selftest

      # Replaces FF_Yahoo_OHLC_Updater.py, which appended unadjusted rows onto
      # an adjusted history and manufactured a false signal at every split.
      # A symbol that fails a gate is left untouched on disk and reported;
      # a non-zero exit here fails the run rather than publishing bad data.
      - name: Refresh OHLC data
        run: python FF_OHLC_Updater_v2.py

      # The acceptance test: rebuild the whole history from the repository's own
      # files and compare against the reference set. If a change ever breaks the
      # 358-trade reproduction, the run stops here rather than publishing a
      # dashboard built on rules that have quietly drifted.
      - name: Signal engine acceptance test
        run: python FF_Signal_Engine_v2.py --verify FF_FINAL_v5_n500.csv

      # Replaces FF_Fresh_Signal_Scanner.py, which fired on an intraday Low
      # instead of a Close, scanned Micro Cap into the recommendations, and used
      # a fundamentals flag with no positivity filter.
      - name: Scan for signals
        run: python FF_Signal_Engine_v2.py --since 2026-06-01

      # The ledger is what makes the record a record: append-only, exits filled
      # once, and a signal the scanner stops producing is KEPT and reported
      # rather than deleted.
      - name: Update the signal ledger
        run: python FF_Ledger.py

      # Replaces FF_build_dashboard.py, which read the scanner's overwritten
      # output, hardcoded every row as open, and had no exit handling.
      - name: Build the dashboard
        run: python FF_build_dashboard_v2.py

      - name: Publish dashboard to GitHub Pages
        run: |
          mkdir -p docs
          cp FF_Live_Tracking_Dashboard.html docs/index.html

      - name: Commit and push updated data + dashboard
        run: |
          git config user.name "FF Automation"
          git config user.email "actions@github.com"
          # The run report and quarantine list are build output, not repository
          # content: they are in .gitignore and are kept as the run artifact
          # below. Naming them here made git add fail with exit 1 and took the
          # whole run down after every other step had succeeded.
          # Add only what exists. corporate_actions.csv is written by the NSE
          # bhavcopy updater, which is not wired yet, so on a Yahoo-only run it
          # is legitimately absent -- and naming an absent path makes git add
          # exit 128 and takes the whole run down after every other step has
          # succeeded. That is exactly the failure the comment above describes,
          # repeated with a different file, which is why this is now a loop and
          # not a list: a file that is not there yet must not be fatal.
          for f in ohlc_data fresh_signals.csv signals.csv watchlist_microcap.csv \
                   signal_ledger.csv watchlist_ledger.csv corporate_actions.csv \
                   docs/index.html; do
            if [ -e "$f" ]; then git add "$f"; else echo "absent, not added: $f"; fi
          done
          git diff --quiet --cached || git commit -m "Automated daily update: $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      # Runs even when the updater quarantined something, so the evidence is
      # kept rather than lost with the failed run.
      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohlc-update-report
          path: |
            ohlc_update_report.json
            ohlc_quarantine.txt
          if-no-files-found: ignore
