# FF — Daily Live Dashboard Update
# ====================================
# Runs every trading-day evening after NSE close: refresh OHLC -> scan for
# signals -> rebuild the dashboard -> publish to GitHub Pages.
#
# Can also be triggered by hand from the Actions tab -> this workflow ->
# "Run workflow".

name: Daily Dashboard Update

on:
  schedule:
    # 13:30 UTC = 19:00 IST, Monday-Friday. Well after the 15:30 close, so
    # Yahoo has published end-of-day data.
    - cron: '30 13 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas numpy beautifulsoup4 lxml

      # A fast, network-free proof that the corporate-action logic still
      # behaves before it is allowed anywhere near the real files. If the
      # guard that refuses a non-equity bonus ever breaks, the run stops here
      # instead of writing a 21x cliff into the price history.
      - name: Updater self-test
        run: python FF_OHLC_Updater_v2.py --selftest

      # Replaces FF_Yahoo_OHLC_Updater.py, which appended unadjusted rows onto
      # an adjusted history and manufactured a false signal at every split.
      # A symbol that fails a gate is left untouched on disk and reported;
      # a non-zero exit here fails the run rather than publishing bad data.
      - name: Refresh OHLC data
        run: python FF_OHLC_Updater_v2.py

      - name: Scan for fresh signals
        run: python FF_Fresh_Signal_Scanner.py

      - name: Build the dashboard
        run: python FF_build_dashboard.py

      - name: Publish dashboard to GitHub Pages
        run: |
          mkdir -p docs
          cp FF_Live_Tracking_Dashboard.html docs/index.html

      - name: Commit and push updated data + dashboard
        run: |
          git config user.name "FF Automation"
          git config user.email "actions@github.com"
          git add ohlc_data/ fresh_signals.csv docs/index.html ohlc_update_report.json ohlc_quarantine.txt
          git diff --quiet --cached || git commit -m "Automated daily update: $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      # Runs even when the updater quarantined something, so the evidence is
      # kept rather than lost with the failed run.
      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohlc-update-report
          path: |
            ohlc_update_report.json
            ohlc_quarantine.txt
          if-no-files-found: ignore
