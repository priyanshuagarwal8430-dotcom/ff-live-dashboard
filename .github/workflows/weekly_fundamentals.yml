# FF — Weekly Fundamentals Check
# ==================================
# Runs every Sunday, year-round. Most weeks it will find nothing new (results
# only actually land during the ~6-8 week window after each quarter-end) —
# that's expected and harmless, it just logs "0 new rows" and exits. Running
# weekly year-round is simpler and more robust than trying to precisely
# predict each quarter's results-season window, and costs almost nothing
# (GitHub gives free compute minutes for this kind of job).
#
# IMPORTANT — this step is NOT yet confirmed reliable. Screener.in's scraper
# needs to be tested from GitHub's servers before trusting this fully — see
# the note in the conversation. Until confirmed, treat this as best-effort;
# check the Actions tab occasionally to see if it's actually finding data.
#
# You can also trigger it manually from the "Actions" tab -> this workflow
# -> "Run workflow" — useful right after you know results have started
# coming out for a quarter.

name: Weekly Fundamentals Check

on:
  schedule:
    - cron: '0 6 * * 0'   # 06:00 UTC every Sunday (~11:30 AM IST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas lxml

      - name: Scrape latest fundamentals from Screener
        run: python FF_Screener_Fundamentals_Scraper.py

      - name: Merge into fund_flags.csv
        run: python FF_fundamentals_ingest.py

      - name: Commit and push updated fundamentals
        run: |
          git config user.name "FF Automation"
          git config user.email "actions@github.com"
          git add fund_flags.csv fundamentals_master.csv
          git diff --quiet --cached || git commit -m "Weekly fundamentals check: $(date +'%Y-%m-%d')"
          git push
